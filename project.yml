name: Schwaerzen

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

packages:
  OpenMedKit:
    url: https://github.com/maziyarpanahi/openmed.git
    from: 1.2.0
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX.git
    from: 0.14.1

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MTL_FAST_MATH: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf

targets:
  Schwaerzen:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Schwaerzen
        excludes:
          - .DS_Store
    dependencies:
      - package: OpenMedKit
        product: OpenMedKit
      - package: CoreXLSX
        product: CoreXLSX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.satus.schwaerzen
        PRODUCT_NAME: Schwaerzen
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Schwaerzen/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Schwärzen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 SATUS GmbH · GPL-3.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_PREVIEWS: NO

schemes:
  Schwaerzen:
    build:
      targets:
        Schwaerzen: all
    run:
      config: Debug
    archive:
      config: Release
